services:
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq-local
    environment:
      RABBITMQ_DEFAULT_USER: rita_local
      RABBITMQ_DEFAULT_PASS: LocalRabbitOnly123
      RABBITMQ_DEFAULT_VHOST: rita_test
    ports:
      - '127.0.0.1:5673:5672'
      - '127.0.0.1:15673:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  rabbitmq-data:
